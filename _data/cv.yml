    Experience:
      - company: Iowa State University, WiCI
        position: Research Assistant Professor
        location: Ames, Iowa, USA
        start_date: 2026-06
        end_date: present
        highlights:
          - Wireless network architecture and Open RAN research at the Center for Wireless, Communities and Innovation.
          - Lead investigator on field deployments for the ARA Wireless Living Lab, ACCoRD, and ArMORED.

      - company: Iowa State University, WiCI
        position: Research Assistant
        location: Ames, Iowa, USA
        start_date: 2021-01
        end_date: 2026-05
        highlights:
          - Designed, implemented, and deployed the $16M ARA wireless living lab end to end, including network planning, equipment selection, vendor coordination, and field rollout.
          - Lead member at ISU on the $42M NTIA-funded ACCoRD Open RAN project, driving integration and architecture work across O-CU, O-DU, O-RU, and core.
          - Co-led the $10M NTIA-funded ArMORED project on energy-efficient mMIMO O-RAN with Skylark Wireless and Eridan.
          - Led the Skylark Wireless mMIMO deployment and built a publicly available API repo (AraMIMO) for PHY/MAC research.
          - Stood up an OpenStack-based testbed control plane for external researcher access.

      - company: Skylark Wireless, LLC
        position: Wireless Engineering Intern
        location: Houston, Texas, USA
        start_date: 2023-05
        end_date: 2023-08
        highlights:
          - Refined modding APIs for external collaboration on scheduling and grouping algorithms.
          - Industry exposure to mMIMO infrastructure and CI/CD practice.

      - company: National Telecom Corporation
        position: Assistant Divisional Engineer
        location: Islamabad, Pakistan
        start_date: 2015-07
        end_date: 2020-12
        highlights:
          - Planned, deployed, and troubleshot DSLAMs, switches, routers, BRAS, and other network equipment serving hundreds of thousands of customers.
          - Coordinated 3G/4G wireless broadband services with third-party operators.
          - Supervised customer support staff and ensured 24/7 service availability.
          - Forecasted internet capacity, managed inventory, and led ground troubleshooting.

      - company: Communicators Globe (Pvt) Ltd
        position: Application Support Engineer
        location: Islamabad, Pakistan
        start_date: 2014-08
        end_date: 2015-07
        highlights:
          - Deployed Cisco routers and switches; planned microwave communication links.
          - Trained customers and produced product operation manuals.

    Projects:
      - name: ARA Wireless Living Lab
        summary: "$16M, NSF PAWR (2021–present). Designed, implemented, and deployed the testbed serving advanced wireless research and rural communities."

      - name: ACCoRD
        summary: "$42M, NTIA NOFO-1 (2024–present). Lead Open RAN integration and architecture (O-CU, O-DU, O-RU, core) at the ISU site."

      - name: ArMORED
        summary: "$10M, NTIA NOFO-2 (2025–present). Energy efficiency study, test case design, and field deployment for new O-RU prototypes with Skylark Wireless and Eridan."

